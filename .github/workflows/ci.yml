# @file ci.yml
# @brief Compila y prueba la consola y la aplicación de escritorio en Linux, Windows y macOS.
# @author Santiago Caicedo

name: CI

on:
  push:
  pull_request:

jobs:
  compilar-y-probar:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libgl1-mesa-dev

      - name: Instalar Qt (Windows y macOS)
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true

      - name: Configurar
        run: cmake -S . -B build -DALMACEN_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release

      - name: Pruebas
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  sanitizadores:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar con sanitizadores (solo el núcleo)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DALMACEN_WARNINGS_AS_ERRORS=ON -DALMACEN_BUILD_GUI=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build
      - name: Pruebas
        run: ctest --test-dir build --output-on-failure

  formato:
    name: Formato (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar formato
        run: find src tests herramientas -name '*.?pp' | xargs clang-format --dry-run --Werror
